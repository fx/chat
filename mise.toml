# Development toolchain. mise-first: install everything mise can manage with
# `mise install`; the Android SDK (no first-party mise backend) is installed by
# `mise run android:setup` into .toolchain/ (gitignored, survives $HOME wipes).

[tools]
bun = "1.3.14"
node = "22"
java = "temurin-17"
"github:fx/tx" = "2.0.0"
rust = { version = "1.99", profile = "minimal", targets = "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }

[env]
# Rust toolchains and the cargo registry live in the workspace, not $HOME.
RUSTUP_HOME = "{{config_root}}/.toolchain/rustup"
CARGO_HOME = "{{config_root}}/.toolchain/cargo"
ANDROID_HOME = "{{config_root}}/.toolchain/android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.toolchain/android-sdk"
NDK_HOME = "{{config_root}}/.toolchain/android-sdk/ndk/27.2.12479018"
ANDROID_USER_HOME = "{{config_root}}/.toolchain/android-home"
ANDROID_AVD_HOME = "{{config_root}}/.toolchain/android-home/avd"
GRADLE_USER_HOME = "{{config_root}}/.toolchain/gradle"
_.path = [
  "{{config_root}}/.toolchain/cargo/bin",
  "{{config_root}}/.toolchain/android-sdk/platform-tools",
  "{{config_root}}/.toolchain/android-sdk/emulator",
  "{{config_root}}/.toolchain/android-sdk/cmdline-tools/latest/bin",
]

[tasks."android:setup"]
description = "Install the Android SDK, NDK, emulator and a test AVD into .toolchain/"
run = "bash scripts/android-setup.sh"

[tasks."android:build"]
description = "Build the reference app's debug APK (x86_64 + arm64)"
run = "bun run build && cd apps/mobile && bunx tauri android build --debug --apk --target x86_64 aarch64"

[tasks."android:release"]
description = "Build the reference app's signed release APK (arm64 + armv7)"
# Signed when apps/mobile/src-tauri/gen/android/keystore.properties exists
# (see apps/mobile/src-tauri/gen/android/app/build.gradle.kts), unsigned otherwise.
run = "bun run build && cd apps/mobile && bunx tauri android build --apk --target aarch64 armv7"

[tasks."android:emulator"]
description = "Boot the test emulator"
run = "emulator -avd fxchat -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect"

[tasks."tui:install"]
description = "Build the libraries, add this repo as the `chat` tx marketplace (tx chat) and link the local builds into it"
# tx installs apps/tui's own package.json, which pins the published libraries;
# the local builds are linked over them so `tx chat` runs this checkout's code.
run = """
bun run build
tx marketplace add "$PWD" --name chat
for p in core agent ink; do rm -rf "apps/tui/node_modules/@fx-/chat-$p" && ln -s "$PWD/packages/$p" "apps/tui/node_modules/@fx-/chat-$p"; done
"""
