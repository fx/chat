[package]
name = "fx-chat"
version = "0.1.0"
description = "Reference app for the @fx/chat libraries"
authors = []
license = "MIT"
repository = "https://github.com/fx/chat"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fx_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# `unsafe-headers` lets the app blank the Origin header, which some local model
# servers reject for unknown origins.
tauri-plugin-http = { version = "2.8.1", features = ["unsafe-headers"] }
