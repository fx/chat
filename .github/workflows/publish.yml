# Publish `@fx/chat-core`, `@fx/chat` and `@fx/chat-agent` to GitHub Packages, in lockstep.
#
# Every push to `main` publishes a commit-pinned prerelease version
# (`0.0.0-<short-sha>`), so consumers can pin an exact main commit the same way
# they pin `@fx/ui`. A `workflow_dispatch` run publishes the same for whatever
# ref it is dispatched on.
name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # `.npmrc` authenticates the `@fx` GitHub Packages registry with this.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build library
        run: bun run build

      - name: Set commit-pinned versions
        # Plain file edit — `npm version` resolves the whole dependency tree and
        # rejects the monorepo root's `workspace:*` protocol. `npm publish` does
        # not rewrite `workspace:*` either, so the internal dependency is pinned
        # to the same commit version here.
        run: |
          node -e "
            const fs = require('fs')
            const version = '0.0.0-' + process.argv[1]
            for (const dir of ['packages/core', 'packages/chat', 'packages/agent']) {
              const file = dir + '/package.json'
              const p = JSON.parse(fs.readFileSync(file, 'utf8'))
              p.version = version
              for (const name of Object.keys(p.dependencies ?? {})) {
                if (name.startsWith('@fx/chat')) p.dependencies[name] = version
              }
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\\n')
            }
          " "$(git rev-parse --short HEAD)"

      - name: Publish to GitHub Packages
        run: |
          for dir in packages/core packages/chat packages/agent; do
            (cd "$dir" && printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc && npm publish && rm -f .npmrc)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
