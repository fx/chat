# Publish `@fx/chat` to GitHub Packages.
#
# Every push to `main` publishes a commit-pinned prerelease version
# (`0.0.0-<short-sha>`), so consumers can pin an exact main commit the same way
# they pin `@fx/ui`. A `workflow_dispatch` run publishes the same for whatever
# ref it is dispatched on.
name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # `.npmrc` authenticates the `@fx` GitHub Packages registry with this.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build library
        run: bun run build

      - name: Set commit-pinned version
        working-directory: packages/chat
        run: npm version --no-git-tag-version "0.0.0-$(git rev-parse --short HEAD)"

      - name: Publish to GitHub Packages
        working-directory: packages/chat
        run: |
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          npm publish
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
