# Release `@fx-/chat-core`, `@fx-/chat`, `@fx-/chat-agent`, `@fx-/chat-ink` and
# `@fx-/chat-shadcn` to npm, in lockstep.
#
# release-please keeps a release pull request open on `main`; merging it tags
# the release, and only then are the packages published.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases must never be cancelled part-way through: a run that has already
# tagged but not yet published would leave a tag with no package behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please acts through the App token minted below, never through the
    # default workflow token, so this job needs no write scopes of its own.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with the default GITHUB_TOKEN does not trigger
      # other workflows, so the release pull request would merge without ever
      # running CI. Acting as the App makes it an ordinary pull request.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          # The job-level permissions block scopes GITHUB_TOKEN, not this token,
          # so the App token is narrowed here instead.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # A release only exists once a maintainer has merged the release pull
    # request, which is the human action that authorizes publication.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # `bun install` resolves `@fx/ui` (the demo's fx-ui registry) from GitHub Packages.
      packages: read
      # Required for npm OIDC trusted publishing; no registry token is stored.
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # `.npmrc` authenticates the `@fx` GitHub Packages registry with this.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same gates CI enforces, so a release is published only from a
      # commit that passes them.
      - name: Quality gates
        run: |
          bun run check:no-internal-refs
          bun run check
          bun run build
          bun run typecheck
          bun run test

      # Trusted publishing requires npm >= 11.5.1 and Node.js >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers).
      - name: Set up Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm to a trusted-publishing capable release
        run: npm install --global npm@^11.5.1

      # `bun pm pack` pins `workspace:*` to the version `bun.lock` records for
      # each workspace, and release-please bumps only the package.json files, so
      # the lockfile is refreshed first.
      - name: Refresh workspace versions in the lockfile
        run: bun install
        env:
          # `.npmrc` authenticates the `@fx` GitHub Packages registry with this.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `npm publish` does not rewrite `workspace:*`, so each package is packed
      # with `bun pm pack` (which pins internal dependencies to the released
      # version) and the tarball is published with npm, which authenticates over
      # OIDC and attaches provenance. A tarball whose internal dependencies are
      # not pinned to the released version fails the step before it is
      # published. Dependencies are published first; a version already on the
      # registry is skipped so a failed run can be re-run.
      - name: Publish to npm
        run: |
          set -euo pipefail
          for dir in packages/core packages/chat packages/agent packages/ink packages/shadcn; do
            rm -rf "$RUNNER_TEMP/pack" && mkdir -p "$RUNNER_TEMP/pack"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP/pack")
            tarball=$(ls "$RUNNER_TEMP/pack"/*.tgz)
            tar -xOzf "$tarball" package/package.json | node -e "
              const p = JSON.parse(require('fs').readFileSync(0, 'utf8'))
              const deps = { ...p.dependencies, ...p.peerDependencies }
              const bad = Object.entries(deps).filter(([n, v]) => n.startsWith('@fx-/') && v !== p.version)
              if (bad.length) {
                console.error(p.name + ': internal dependencies not pinned to ' + p.version + ': ' + JSON.stringify(Object.fromEntries(bad)))
                process.exit(1)
              }
            "
            npm publish "$tarball"
          done
