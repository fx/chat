name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job widens its own scope.
permissions:
  contents: read

# Allow one concurrent deployment; queue new pushes, don't cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read access to GitHub Packages so `bun install` can resolve `@fx/ui`.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # `.npmrc` authenticates the `@fx` GitHub Packages registry with this.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build library
        run: bun run build

      - name: Build demo
        run: bun run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demos/chat-demo/dist

  deploy:
    needs: build
    # Only publish artifacts from the default branch, even on manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
